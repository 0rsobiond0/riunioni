# Configuration for the AI meeting recorder.
# RIUNIONI_* environment variables override the values below.

audio:
  sample_rate: 16000
  channels: 1
  device: null            # null = default device; e.g. "hw:2,0" for a USB mic
  chunk_seconds: 1.0      # capture and disk-write block
  list_devices_on_start: true

stt_live:
  engine: vosk            # vosk = low-latency streaming; faster_whisper = chunked
  vosk_model: models/vosk-model-it-0.22     # large: more accurate, slower to load
  # vosk_model: models/vosk-model-small-it-0.22   # lightweight alternative: faster, less accurate
  model: base             # only used if engine: faster_whisper
  compute_type: int8
  cuda_compute_type: float16
  cpu_threads: 4
  chunk_seconds: 3.0      # audio block transcribed only once
  overlap_seconds: 0.75   # overlap so words are not cut off
  vad_filter: true
  beam_size: 1
  language: it

stt_final:
  model: medium           # medium / large-v3, used when the meeting is finished
  compute_type: int8
  cuda_compute_type: float16
  cpu_threads: 4
  beam_size: 5
  language: it

llm:
  # OpenAI-compatible endpoint. Examples:
  #   base_url: "http://localhost:8080/v1"
  #   api_key: "your-api-key"
  #   models: ["model-1", "model-2"]   # retry in order
  # If base_url is empty the LLM stays disabled: subtitles still work.
  base_url: ""
  api_key: ""
  models: []
  interval_seconds: 25
  timeout_seconds: 45
  glossary: |
    Whisper, faster-whisper, Vosk, Mermaid, Markmap, HDMI,
    MEMS microphone, beamforming.

display:
  host: 127.0.0.1
  port: 8000
  subtitle_lines: 4

finalization:
  # "Stop and save" generates nothing: documents are created later, even offline.
  render_diagrams: true           # SVG/PNG via npx (needs internet the first time)
  accurate_model: null            # null = use stt_final.model (medium)
  # Time estimate for accurate re-transcription; adjust to your machine.
  # estimated seconds = audio_duration * accurate_speed_factor + accurate_overhead_seconds
  accurate_speed_factor: 1.3      # ~1.3x real time
  accurate_overhead_seconds: 10   # model load + startup/finalization

paths:
  output_dir: output
